services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchadvisor
      POSTGRES_PASSWORD: watchadvisor
      POSTGRES_DB: watchadvisor
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchadvisor"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
